name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: demo smoke test
        run: |
          mistrial demo --runs 5 --html none --out-dir /tmp/jf --adaptive --stabilize 3 --pass-mark 0.55
          mistrial rubric-check examples/cases.jsonl -j demo:steady --out-dir /tmp/jf -q
          run=$(ls /tmp/jf/runs/2*.json | head -1)
          mistrial gate-risk "$run" --pass-mark 0.5
          mistrial migrate "$run" --pass-mark 0.6
          mistrial escalate "$run" --out /tmp/jf/needs-human.csv
          mistrial sentinel baseline "$run" --out /tmp/jf/base.json
          mistrial report "$run" --html none --markdown /tmp/jf/card.md
      - name: build
        run: python -m pip install -q build twine && python -m build -q && python -m twine check dist/*
