name: mistrial
description: Is your LLM judge flaky? Run the reliability card in CI and post it on the pull request.
author: Hemanth Dhanasekaran
branding:
  icon: activity
  color: orange

inputs:
  cases:
    description: Path to the cases file (.jsonl, .json or .csv).
    required: true
  judges:
    description: Space-separated judge specs, e.g. "openai:gpt-5.4-mini my_evals:correctness".
    required: true
  runs:
    description: How many times to ask each judge about each case.
    default: "3"
  rubric:
    description: Built-in rubric name or a prompt file.
    default: correctness
  adaptive:
    description: Re-ask only where the first two runs disagreed ("true" or "false").
    default: "false"
  min-self-agreement:
    description: Fail when the chance two runs of a judge agree is below this (0.95 = 95%). Leave empty to skip.
    default: ""
  max-flip-rate:
    description: Fail when any judge flipped on more than this share of cases. Leave empty to skip.
    default: ""
  min-agreement:
    description: Fail when Krippendorff's alpha between judges is below this. Leave empty to skip.
    default: ""
  pass-mark:
    description: Your eval's pass mark, to report the gate false-alarm rate. Leave empty to skip.
    default: ""
  comment:
    description: Post the card as a comment on the pull request ("true" or "false").
    default: "true"
  upload-report:
    description: Upload the HTML report as a workflow artifact ("true" or "false"). It contains your full case text and raw model replies, and anyone with a GitHub account can download artifacts from a public repo, so it is off by default.
    default: "false"
  version:
    description: mistrial version to install (a PyPI version spec, or "." for the checked-out repo).
    default: ""
  github-token:
    description: Token used to post the comment.
    default: ${{ github.token }}

outputs:
  exit-code:
    description: 0 when every gate passed, 1 when one failed.
    value: ${{ steps.run.outputs.exit-code }}
  markdown:
    description: Path to the markdown card.
    value: ${{ steps.run.outputs.markdown }}

runs:
  using: composite
  steps:
    - name: Install mistrial
      shell: bash
      env:
        JF_VERSION: ${{ inputs.version }}
      run: |
        if [ "$JF_VERSION" = "." ]; then
          python -m pip install -q -e .
        elif [ -n "$JF_VERSION" ]; then
          python -m pip install -q "mistrial$JF_VERSION"
        else
          python -m pip install -q mistrial
        fi

    - name: Run the reliability card
      id: run
      shell: bash
      # Inputs go through the environment, never into the script text, so a value with a quote
      # or a semicolon is data and not shell.
      env:
        JF_CASES: ${{ inputs.cases }}
        JF_JUDGES: ${{ inputs.judges }}
        JF_RUNS: ${{ inputs.runs }}
        JF_RUBRIC: ${{ inputs.rubric }}
        JF_ADAPTIVE: ${{ inputs.adaptive }}
        JF_MIN_SELF: ${{ inputs.min-self-agreement }}
        JF_MAX_FLIP: ${{ inputs.max-flip-rate }}
        JF_MIN_AGREE: ${{ inputs.min-agreement }}
        JF_PASS_MARK: ${{ inputs.pass-mark }}
        JF_TITLE: mistrial · ${{ github.repository }}
      run: |
        set +e
        args=()
        for j in $JF_JUDGES; do args+=(--judge "$j"); done
        [ -n "$JF_MIN_SELF" ] && args+=(--min-self-agreement "$JF_MIN_SELF")
        [ -n "$JF_MAX_FLIP" ] && args+=(--max-flip-rate "$JF_MAX_FLIP")
        [ -n "$JF_MIN_AGREE" ] && args+=(--min-agreement "$JF_MIN_AGREE")
        [ -n "$JF_PASS_MARK" ] && args+=(--pass-mark "$JF_PASS_MARK")
        [ "$JF_ADAPTIVE" = "true" ] && args+=(--adaptive)
        mkdir -p .mistrial
        mistrial run "$JF_CASES" "${args[@]}" --runs "$JF_RUNS" --rubric "$JF_RUBRIC" \
          --html .mistrial/report.html --markdown .mistrial/comment.md --title "$JF_TITLE"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "markdown=.mistrial/comment.md" >> "$GITHUB_OUTPUT"
        cat .mistrial/comment.md >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        pr="$PR_NUMBER"
        repo="$REPO"
        body=$(cat .mistrial/comment.md)
        existing=$(gh api "repos/$repo/issues/$pr/comments" --paginate --jq '.[] | select(.body | startswith("<!-- mistrial -->")) | .id' | head -1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$existing" -f body="$body" > /dev/null
        else
          gh api "repos/$repo/issues/$pr/comments" -f body="$body" > /dev/null
        fi

    - name: Upload the HTML report
      if: inputs.upload-report == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: mistrial-report
        path: .mistrial/report.html
        if-no-files-found: ignore

    - name: Fail if a gate failed
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code }}
