[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mistrial"
version = "0.2.0"
description = "Is your LLM judge flaky? Re-run any evaluator across runs and judge models and get a reliability card: flip rate, agreement, drift, and the cases that flip."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hemanth Dhanasekaran" }]
keywords = ["llm", "evals", "llm-as-a-judge", "evaluation", "reliability", "langsmith", "openevals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mistrial = "mistrial.cli:app"

[project.urls]
Homepage = "https://github.com/hemanth1999k/mistrial"
Issues = "https://github.com/hemanth1999k/mistrial/issues"
Changelog = "https://github.com/hemanth1999k/mistrial/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mistrial"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
